name: ✨ 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法。请尽量描述**你想解决的场景**，而不是直接给实现方案 —— 一起讨论往往能得到更好的解法。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 你现在是怎么绕过去的？卡在哪里？
      placeholder: 想回看某位 KOL 半年内的所有判断并导出对比，现在只能一条条点开手动抄
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它长什么样 / 怎么用？有参考产品也可以贴
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - HUD 极速存证
        - 主面板 Dashboard
        - 菜单栏微面板
        - 复盘详情 / 存证流水
        - 来源档案 / KOL 管理
        - MBTI 人格 / 战绩统计
        - 设置
        - 行情数据源扩展
        - 自动对账 / 结算逻辑
        - Apple 生态联动（日历 / 提醒 / 深链）
        - 存储 / 导出
        - 其他
    validations:
      required: true

  - type: dropdown
    id: privacy
    attributes:
      label: 是否涉及云端 / 第三方服务？
      description: 本项目的核心原则是「零云端依赖、纯本地私密」，引入任何联网服务都会被重点讨论
      options:
        - 不涉及，纯本地
        - 需要联网取公开数据
        - 需要账号或服务端
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他更轻的实现路径？
